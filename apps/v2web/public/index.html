<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>المجلس</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0e1116; --surface: #171c24; --surface2: #1f2630; --line: #2b3441;
        --ink: #e9edf3; --muted: #93a0b0; --accent: #d9a441; --accent2: #4a6da6;
        --good: #4c9e7a; --bad: #c65f57; --warn: #cf9a3a;
      }
      * { box-sizing: border-box; }
      body { font-family: "Cairo", system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
      html[lang="en"] body { font-family: system-ui, "Segoe UI", sans-serif; }
      .wrap { max-width: 620px; margin: 0 auto; padding: 14px 16px 40px; min-height: 100vh; }
      h1 { font-size: 30px; font-weight: 900; margin: 6px 0; letter-spacing: -0.5px; }
      h2 { font-size: 22px; font-weight: 700; margin: 6px 0; }
      h3 { font-size: 16px; font-weight: 700; margin: 10px 0 6px; color: var(--muted); }
      p { line-height: 1.6; }
      .muted { color: var(--muted); font-size: 14px; }
      .big { font-size: 21px; line-height: 1.5; font-weight: 600; }
      button { font-family: inherit; font-size: 16px; font-weight: 600; min-height: 52px; padding: 12px 18px; margin: 4px 0; border-radius: 14px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); cursor: pointer; width: 100%; transition: transform .05s, background .12s, border-color .12s; }
      button:active { transform: scale(0.99); }
      button.primary { background: var(--accent); color: #17130a; border-color: var(--accent); }
      button.ghost { background: transparent; }
      button.sel { border-color: var(--accent); background: #2a2417; box-shadow: inset 0 0 0 1px var(--accent); }
      button:disabled { opacity: .45; cursor: default; }
      button.mini { min-height: 40px; font-size: 14px; padding: 8px 12px; width: auto; }
      input { font-family: inherit; font-size: 16px; min-height: 50px; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
      .chip.stable { color: var(--good); border-color: #2e4a3f; }
      .chip.strained { color: var(--warn); border-color: #4a4127; }
      .chip.critical { color: var(--bad); border-color: #4a2e2b; }
      .pill { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); font-size: 14px; margin: 3px; }
      .pill.you { border-color: var(--accent2); }
      .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-inline-end: 6px; }
      .tag.rumored { color: var(--warn); border-color: #4a4127; }
      .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; font-variant-numeric: tabular-nums; }
      .center { text-align: center; }
      .focal { text-align: center; padding: 30px 12px; }
      .focal .em { font-size: 26px; font-weight: 900; margin: 10px 0; }
      .timer { font-size: 15px; color: var(--muted); }
      .timer.urgent { color: var(--bad); font-weight: 700; }
      .reveal-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
      .story { white-space: pre-wrap; line-height: 1.8; }
      .langbar { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 4px; }
      .langbar button { width: auto; min-height: 34px; padding: 4px 12px; font-size: 13px; }
      .err { color: #f0b6b0; background: #2a1a19; border: 1px solid #4a2e2b; border-radius: 12px; padding: 12px; }
      .roleband { display:inline-block; font-weight:700; color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap"><div class="langbar" id="langbar"></div><div id="app">…</div></div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
