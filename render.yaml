services:
  - type: web
    name: dass-live
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run bfbuild
    startCommand: npm run dassserver
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Account, store checkout, receipts and support remain browser-local until
      # production providers are implemented. The UI labels this mode explicitly.
      - key: DASS_DEMO_MODE
        value: "true"
