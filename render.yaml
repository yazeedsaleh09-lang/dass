services:
  - type: web
    name: dass-live
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npm run dassbuild
    startCommand: npm run dassserver
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
